# Overfit sanity check: memorize 64 fixed CIFAR-10 images.
# Sinkhorn coupling + tau=0.5, T=30. Single GPU intended, B=64.

data:
  target: utils.data.CIFAR10
  params:
    root: ~/data/CIFAR-10
    image_size: 32
    subset_size: 64


dataloader:
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2


model:
  target: models.unet.UNet
  params:
    input_size: 32
    in_channels: 3
    out_channels: 3
    dim: 128
    dim_mults: [1, 2, 2, 2]
    use_attn_size: [16, ]
    num_res_blocks: 2
    num_heads: 1
    dropout: 0.0


encoder:
  target: models.encoders.dinov2.DINOv2Encoder
  params:
    layers:
      - norm
    global_stat: true
    patch2_stat: true
    patch4_stat: true
    grad_checkpoint: false


drifting:
  method: split
  plan_type: sinkhorn
  eps: 0.5
  sinkhorn_iters: 30
  dist_metric: l2_sq
  normalize_feature: true


train:
  num_steps: 1000

  num_groups: 1
  num_real_samples: 64
  num_fake_samples: 64

  ema_decay: 0.999
  clip_grad_norm: 1.0

  print_freq: 25
  save_freq: 999999
  sample_freq: 100

  optim:
    target: torch.optim.AdamW
    params:
      lr: 2e-4
      betas: [0.9, 0.95]
      weight_decay: 0.01

  sched:
    target: utils.scheduler.CosineWarmupLR
    params:
      warmup_steps: 100
      training_steps: 1000
