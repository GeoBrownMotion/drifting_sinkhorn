# Fine-tune Arm B (treatment): switch to Sinkhorn drifting for an extra 5K
# iterations on top of the SAME baseline checkpoint used by Arm A.
#
# Identical to cifar10-unc-split-baseline-finetune.yaml EXCEPT:
#   - drifting.plan_type: sinkhorn (vs two-sided)
# This is the apples-to-apples treatment arm. If Arm B's FID < Arm A's FID,
# Sinkhorn drifting is providing measurable gains even on top of an already
# well-tuned baseline -- directly answering Reviewer WmkM's "practical
# superiority" concern.
#
# Launch (must be the SAME baseline ckpt as Arm A):
#   torchrun --nproc-per-node 4 --master_port 29561 train_unc.py \
#     -c configs/cifar10-unc-split-sinkhorn-finetune.yaml \
#     -e runs/finetune_armB_sinkhorn_5k --bf16 \
#     --resume runs/<baseline_run>/ckpt/step0029999

data:
  target: utils.data.CIFAR10
  params:
    root: ~/data/CIFAR-10
    image_size: 32


dataloader:
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2


model:
  target: models.unet.UNet
  params:
    input_size: 32
    in_channels: 3
    out_channels: 3
    dim: 128
    dim_mults: [1, 2, 2, 2]
    use_attn_size: [16, ]
    num_res_blocks: 2
    num_heads: 1
    dropout: 0.0


encoder:
  target: models.encoders.dinov2.DINOv2Encoder
  params:
    layers:
      - norm
    global_stat: true
    patch2_stat: true
    patch4_stat: true
    grad_checkpoint: true


drifting:
  method: split
  plan_type: sinkhorn         # <-- only difference vs Arm A
  eps: 0.5
  sinkhorn_iters: 20
  dist_metric: l2_sq
  normalize_feature: true


train:
  num_steps: 35000

  num_groups: 1
  num_real_samples: 2048
  num_fake_samples: 2048

  ema_decay: 0.999
  clip_grad_norm: 2.0

  print_freq: 100
  save_freq: 1000
  sample_freq: 1000

  optim:
    target: torch.optim.AdamW
    params:
      lr: 5e-5
      betas: [0.9, 0.95]
      weight_decay: 0.01

  sched:
    target: utils.scheduler.CosineWarmupLR
    params:
      warmup_steps: 5000
      training_steps: 35000
