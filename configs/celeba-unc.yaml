data:
  target: utils.data.CelebA
  params:
    root: ~/data/CelebA
    image_size: 64


dataloader:
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2


model:
  target: models.unet.UNet
  params:
    input_size: 64
    in_channels: 3
    out_channels: 3
    dim: 128
    dim_mults: [1, 2, 2, 2]
    use_attn_size: [16, ]
    num_res_blocks: 2
    num_heads: 1
    dropout: 0.0


encoder:
  target: models.encoders.dinov2.DINOv2Encoder
  params:
    model_name: dinov2_vitb14
    resolution: 64


drifting:
  kernel_temp: [0.02, 0.05, 0.2]
  implementation: paper-algorithm2
  normalize_feature: true
  normalize_drift: true


train:
  num_steps: 100000
  batch_size: 1024
  gen_batch_size: 1024

  ema_decay: 0.999
  clip_grad_norm: 2.0

  print_freq: 100
  save_freq: 10000
  sample_freq: 2000
  num_samples: 64

  optim:
    target: torch.optim.AdamW
    params:
      lr: 0.00002
      betas: [0.9, 0.95]
      weight_decay: 0.01

  sched:
    target: utils.scheduler.CosineWarmupLR
    params:
      warmup_steps: 5000
      training_steps: 100000
