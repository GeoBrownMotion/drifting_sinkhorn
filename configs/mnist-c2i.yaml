data:
  target: utils.data.MNIST
  params:
    root: ~/data/MNIST
    image_size: 32


dataloader:
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2


model:
  target: models.unet.UNet
  params:
    input_size: 32
    in_channels: 1
    out_channels: 1
    dim: 64
    dim_mults: [1, 2, 2, 2]
    use_attn_size: [16, ]
    num_res_blocks: 2
    num_heads: 1
    dropout: 0.0
    num_classes: 10


drifting:
  kernel_temp: [0.02, 0.05, 0.2]
  implementation: paper-algorithm2
  normalize_feature: true
  normalize_drift: true


train:
  num_steps: 10000

  num_classes_per_batch: 10
  num_samples_per_class: 32
  gen_num_samples_per_class: 32

  alpha_min: 1.0
  alpha_max: 4.0
  alpha_power: 5.0

  ema_decay: 0.999
  clip_grad_norm: 2.0

  print_freq: 10
  save_freq: 2000
  sample_freq: 500
  num_samples: 10

  optim:
    target: torch.optim.AdamW
    params:
      lr: 0.0002
      betas: [0.9, 0.95]
      weight_decay: 0.01

  sched:
    target: utils.scheduler.ConstantWarmupLR
    params:
      warmup_steps: 500
