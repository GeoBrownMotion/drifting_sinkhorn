data:
  target: utils.data.CIFAR10
  params:
    root: ~/data/CIFAR-10
    image_size: 32


dataloader:
  num_workers: 16
  pin_memory: true
  prefetch_factor: 2


model:
  target: models.unet.UNet
  params:
    input_size: 32
    in_channels: 3
    out_channels: 3
    dim: 128
    dim_mults: [1, 2, 2, 2]
    use_attn_size: [16, ]
    num_res_blocks: 2
    num_heads: 1
    dropout: 0.0


encoder:
  target: models.encoders.dinov2.DINOv2Encoder
  params:
    layers:
      - norm
    global_stat: true
    patch2_stat: true
    patch4_stat: true


drifting:
  kernel_temp: [0.02, 0.05, 0.2]
  implementation: mutual-softmax
  normalize_feature: true
  normalize_drift: true


train:
  num_steps: 100000

  num_groups: 1
  num_real_samples: 640
  num_fake_samples: 640

  ema_decay: 0.999
  clip_grad_norm: 2.0

  print_freq: 100
  save_freq: 10000
  sample_freq: 2000

  optim:
    target: torch.optim.AdamW
    params:
      lr: 5e-5
      betas: [0.9, 0.95]
      weight_decay: 0.01

  sched:
    target: utils.scheduler.CosineMinimumWarmupLR
    params:
      warmup_steps: 5000
      training_steps: 100000
      min_lr: 1e-5
