# Quick tau-screening config (5K iter) for picking the best (plan_type, tau)
# cell BEFORE committing 30-50h to a full 30K run.
#
# Both plan_type and eps are expected to be overridden at launch via
# --set drifting.plan_type=... --set drifting.eps=... (see tools/sweep_tau_run.sh).
#
# IMPORTANT: this yaml is byte-identical to cifar10-unc-split-{baseline,sinkhorn}.yaml
# EXCEPT for `train.num_steps: 30000 -> 5000`. All other parameters --
# warmup_steps=5000, training_steps=30000 (so the cosine schedule shape is
# the SAME as production; we just stop early), save_freq/sample_freq=2500,
# B=2048, encoder, model, optimizer -- are unchanged. This makes the
# ranking observed at 5K representative of the first 5K of a production
# run, matching the user's existing chart.

data:
  target: utils.data.CIFAR10
  params:
    root: ~/data/CIFAR-10
    image_size: 32


dataloader:
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2


model:
  target: models.unet.UNet
  params:
    input_size: 32
    in_channels: 3
    out_channels: 3
    dim: 128
    dim_mults: [1, 2, 2, 2]
    use_attn_size: [16, ]
    num_res_blocks: 2
    num_heads: 1
    dropout: 0.0


encoder:
  target: models.encoders.dinov2.DINOv2Encoder
  params:
    layers:
      - norm
    global_stat: true
    patch2_stat: true
    patch4_stat: true
    grad_checkpoint: true


drifting:
  method: split
  plan_type: sinkhorn        # OVERRIDE via --set drifting.plan_type=two-sided
  eps: 0.05                  # OVERRIDE via --set drifting.eps=0.02 (or 0.1, 0.5, ...)
  sinkhorn_iters: 20         # ignored for plan_type=two-sided
  dist_metric: l2_sq
  normalize_feature: true


train:
  num_steps: 5000

  num_groups: 1
  num_real_samples: 2048
  num_fake_samples: 2048

  ema_decay: 0.999
  clip_grad_norm: 2.0

  print_freq: 100
  save_freq: 2500            # match production -> ckpts at step 2499 and 4999
  sample_freq: 2500

  optim:
    target: torch.optim.AdamW
    params:
      lr: 5e-5
      betas: [0.9, 0.95]
      weight_decay: 0.01

  sched:
    target: utils.scheduler.CosineWarmupLR
    params:
      warmup_steps: 5000      # match production
      training_steps: 30000   # match production cosine schedule shape
