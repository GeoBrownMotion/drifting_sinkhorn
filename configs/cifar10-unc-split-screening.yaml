# Quick tau-screening config (5K iter, fast warmup) for picking the best
# (plan_type, tau) cell BEFORE committing 30-50h to a full 30K run.
#
# Both plan_type and eps are expected to be overridden at launch via
# --set drifting.plan_type=... --set drifting.eps=... (see tools/sweep_tau_run.sh).
#
# Compared to the production cifar10-unc-split-{baseline,sinkhorn}.yaml:
#   - num_steps:       30000 -> 5000
#   - warmup_steps:    5000  -> 500   (so most of the budget is post-warmup)
#   - training_steps:  30000 -> 5000  (cosine schedule end matches)
#   - save_freq/sample_freq: 2500 -> 4999 (only the end-of-screening ckpt)
# Everything else (B=2048, encoder, model, optimizer) is unchanged so the
# tau ranking we observe at 5K is representative of the production setup.

data:
  target: utils.data.CIFAR10
  params:
    root: ~/data/CIFAR-10
    image_size: 32


dataloader:
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2


model:
  target: models.unet.UNet
  params:
    input_size: 32
    in_channels: 3
    out_channels: 3
    dim: 128
    dim_mults: [1, 2, 2, 2]
    use_attn_size: [16, ]
    num_res_blocks: 2
    num_heads: 1
    dropout: 0.0


encoder:
  target: models.encoders.dinov2.DINOv2Encoder
  params:
    layers:
      - norm
    global_stat: true
    patch2_stat: true
    patch4_stat: true
    grad_checkpoint: true


drifting:
  method: split
  plan_type: sinkhorn        # OVERRIDE via --set drifting.plan_type=two-sided
  eps: 0.05                  # OVERRIDE via --set drifting.eps=0.02 (or 0.1, 0.5, ...)
  sinkhorn_iters: 20         # ignored for plan_type=two-sided
  dist_metric: l2_sq
  normalize_feature: true


train:
  num_steps: 5000

  num_groups: 1
  num_real_samples: 2048
  num_fake_samples: 2048

  ema_decay: 0.999
  clip_grad_norm: 2.0

  print_freq: 100
  save_freq: 4999            # only the final ckpt (FID will be computed on this one)
  sample_freq: 4999

  optim:
    target: torch.optim.AdamW
    params:
      lr: 5e-5
      betas: [0.9, 0.95]
      weight_decay: 0.01

  sched:
    target: utils.scheduler.CosineWarmupLR
    params:
      warmup_steps: 500       # fast ramp-up so 4500 steps actually train
      training_steps: 5000
