data:
  target: utils.data.ImageNet
  params:
    root: ~/data/ImageNet/ILSVRC2012/Images/train
    image_size: 256


latent:
  target: utils.data.LatentDataset
  params:
    root: ./data/imagenet256-latents


dataloader:
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2


model:
  target: models.driftdit.DriftDiT_B_2
  params:
    input_size: 32
    in_channels: 4
    num_classes: 1000
    num_registers: 16
    num_style_tokens: 32


autoencoder:
  target: models.autoencoders.sdvae.SDVAE
  params: {}


encoder:
  target: models.encoders.latentmae.LatentMAEEncoder
  params:
    model_name: mae_latent_256
    layers:
      - stages.0.1
      - norms.0
      - stages.1.1
      - stages.1.3
      - norms.1
      - stages.2.1
      - stages.2.3
      - stages.2.5
      - norms.2
      - stages.3.1
      - norms.3
    global_stat: true
    patch2_stat: true
    patch4_stat: true


drifting:
  kernel_temp: [0.02, 0.05, 0.2]
  kernel_norm: mutual-softmax
  normalize_feature: true
  normalize_drift: true


train:
  num_steps: 30000

  num_groups: 64
  num_real_samples: 64
  num_fake_samples: 64
  num_unc_samples: 16
  gradient_accumulation: 1

  alpha_min: 1.0
  alpha_max: 4.0
  alpha_power: 3.0

  ema_decay: 0.999
  clip_grad_norm: 2.0

  print_freq: 50
  save_freq: 3000
  sample_freq: 1000

  optim:
    target: torch.optim.AdamW
    params:
      lr: 2e-4
      betas: [0.9, 0.95]
      weight_decay: 0.01

  sched:
    target: utils.scheduler.ConstantWarmupLR
    params:
      warmup_steps: 5000
