# Fine-tune Arm A (control): continue the partial-two-sided baseline for an
# extra 5K iterations on top of an already-trained baseline checkpoint.
#
# Pair with the sinkhorn-finetune yaml (Arm B) below: both must be launched
# with --resume <baseline_ckpt>, so the only experimental difference between
# Arm A and Arm B is plan_type. Used to address Reviewer WmkM's "practical
# superiority remains unclear" concern: does Sinkhorn drifting still help
# starting from a converged baseline?
#
# Launch (assumes baseline trained to step 29999):
#   torchrun --nproc-per-node 4 --master_port 29560 train_unc.py \
#     -c configs/cifar10-unc-split-baseline-finetune.yaml \
#     -e runs/finetune_armA_baseline_5k --bf16 \
#     --resume runs/<baseline_run>/ckpt/step0029999

data:
  target: utils.data.CIFAR10
  params:
    root: ~/data/CIFAR-10
    image_size: 32


dataloader:
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2


model:
  target: models.unet.UNet
  params:
    input_size: 32
    in_channels: 3
    out_channels: 3
    dim: 128
    dim_mults: [1, 2, 2, 2]
    use_attn_size: [16, ]
    num_res_blocks: 2
    num_heads: 1
    dropout: 0.0


encoder:
  target: models.encoders.dinov2.DINOv2Encoder
  params:
    layers:
      - norm
    global_stat: true
    patch2_stat: true
    patch4_stat: true
    grad_checkpoint: true


drifting:
  method: split
  plan_type: two-sided
  eps: 0.5
  sinkhorn_iters: 20  # ignored for plan_type=two-sided; kept for parity with sinkhorn yaml
  dist_metric: l2_sq
  normalize_feature: true


train:
  num_steps: 35000          # 30K (baseline) + 5K (fine-tune extension)

  num_groups: 1
  num_real_samples: 2048
  num_fake_samples: 2048

  ema_decay: 0.999
  clip_grad_norm: 2.0

  print_freq: 100
  save_freq: 1000           # finer-grained ckpts in the 5K window for FID curve
  sample_freq: 1000

  optim:
    target: torch.optim.AdamW
    params:
      lr: 5e-5
      betas: [0.9, 0.95]
      weight_decay: 0.01

  sched:
    target: utils.scheduler.CosineWarmupLR
    params:
      warmup_steps: 5000    # unchanged from original baseline; we are past warmup at step 30K
      training_steps: 35000 # extended cosine endpoint; lr stays small but non-zero in the 5K window
