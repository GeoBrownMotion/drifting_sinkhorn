data:
  target: utils.data.FFHQ
  params:
    root: ~/data/FFHQ/images1024x1024
    image_size: 256


dataloader:
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2


model:
  target: models.driftdit.DriftDiT_S_2
  params:
    input_size: 32
    in_channels: 4
    num_classes: 0


autoencoder:
  target: models.autoencoders.sdvae.SDVAE
  params: {}


encoder:
  target: models.encoders.dinov2.DINOv2Encoder
  params:
    layers:
      - blocks.2
      - blocks.5
      - blocks.8
      - norm
    global_stat: true
    patch2_stat: true
    patch4_stat: true


drifting:
  kernel_temp: [0.02, 0.05, 0.2]
  implementation: paper-algorithm2
  normalize_feature: true
  normalize_drift: true


train:
  num_steps: 100000
  batch_size: 64
  gen_batch_size: 64

  ema_decay: 0.999
  clip_grad_norm: 2.0

  print_freq: 100
  save_freq: 10000
  sample_freq: 2000
  num_samples: 64

  optim:
    target: torch.optim.AdamW
    params:
      lr: 0.00005
      betas: [0.9, 0.95]
      weight_decay: 0.01

  sched:
    target: utils.scheduler.CosineWarmupLR
    params:
      warmup_steps: 5000
      training_steps: 100000
