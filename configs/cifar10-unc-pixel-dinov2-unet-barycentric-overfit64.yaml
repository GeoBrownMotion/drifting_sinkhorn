data:
  target: utils.data.CIFAR10
  params:
    root: /home/hep3/rebuttal/data/cifar10
    image_size: 32
    subset_size: 64

dataloader:
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

model:
  target: models.unet.UNet
  params:
    input_size: 32
    in_channels: 3
    out_channels: 3
    dim: 128
    dim_mults: [1, 2, 2, 2]
    use_attn_size: [16, ]
    num_res_blocks: 2
    num_heads: 1
    dropout: 0.0

encoder:
  target: models.encoders.dinov2.DINOv2Encoder
  params:
    layers:
      - norm
    global_stat: true
    patch2_stat: true
    patch4_stat: true

drifting:
  mode: barycentric
  plan: sinkhorn
  tau: 0.5
  dist_metric: l2_sq
  sinkhorn_iters: 30
  normalize_feature: true
  normalize_drift: true
  self_mask: none

train:
  num_steps: 1000

  num_groups: 1
  num_real_samples: 64
  num_fake_samples: 64

  ema_decay: 0.999
  clip_grad_norm: 2.0

  print_freq: 10
  save_freq: 500
  sample_freq: 100

  optim:
    target: torch.optim.AdamW
    params:
      lr: 5e-5
      betas: [0.9, 0.95]
      weight_decay: 0.01

  sched:
    target: utils.scheduler.CosineWarmupLR
    params:
      warmup_steps: 100
      training_steps: 1000
